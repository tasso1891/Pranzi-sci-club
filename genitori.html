<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14306B">
<meta name="apple-mobile-web-app-title" content="Pranzi">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Pranzi · Sci Club</title>
<style>
  :root{ --blue:#1D4ED8; --dark:#14306B; --yellow:#F2B705; --bg:#EEF3FF; --ink:#0F1B3D; --soft:#5B6B8F; --border:#D5DEF2; --ok:#1E8E4E; --warn:#B7791F; --bad:#C0392B; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .top{ background:var(--dark); color:#fff; padding:calc(22px + env(safe-area-inset-top)) 20px 22px; }
  .eyebrow{ font-size:12px; letter-spacing:.14em; font-weight:800; color:var(--yellow); }
  h1{ margin:4px 0 0; font-size:24px; }
  main{ padding:16px; max-width:560px; margin:0 auto; }
  .card{ background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px; }
  .name{ font-size:26px; font-weight:800; line-height:1.15; }
  .sub{ color:var(--soft); font-size:13px; margin-top:2px; }
  .acc{ width:100%; display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px; font:inherit; color:var(--ink); text-align:left; cursor:pointer; margin-bottom:10px; box-shadow:0 2px 8px rgba(20,48,107,.07); }
  .acc .ico{ font-size:26px; }
  .acc b{ font-size:18px; flex:1; }
  .acc .chev{ font-size:18px; color:var(--soft); transition:transform .2s; }
  .acc.open{ border-color:var(--blue); }
  .acc.open .chev{ transform:rotate(180deg); }
  .panel{ display:none; margin:0 0 12px; }
  .panel.open{ display:block; }
  .badge{ display:inline-block; padding:6px 12px; border-radius:999px; font-weight:800; font-size:13px; color:#fff; }
  .OK{ background:var(--ok); } .RICARICARE{ background:var(--warn); } .PAGARE{ background:var(--bad); }
  .detail{ margin-top:8px; font-size:15px; font-weight:600; }
  .tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .tile{ background:var(--bg); border-radius:12px; padding:10px 6px; text-align:center; }
  .tile b{ display:block; font-size:20px; }
  .tile span{ font-size:11.5px; color:var(--soft); }
  h2{ font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); margin:0 0 8px; }
  .row{ display:flex; justify-content:space-between; gap:8px; padding:9px 0; border-top:1px solid var(--border); font-size:14.5px; }
  .row:first-of-type{ border-top:none; }
  .vuoto{ color:var(--soft); font-size:14px; }
  .obiettivo{ white-space:pre-wrap; font-size:16px; line-height:1.5; }
  .next{ background:var(--blue); color:#fff; border-radius:16px; padding:14px 16px; margin-bottom:12px; }
  .next small{ display:block; font-size:11.5px; font-weight:800; letter-spacing:.08em; opacity:.85; }
  .next b{ display:block; font-size:19px; margin-top:2px; }
  .mese{ margin:14px 0 4px; font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); }
  .gara.passata{ opacity:.5; }
  .gara .t{ font-weight:700; } .gara .q{ color:var(--soft); font-size:13px; margin-top:1px; }
  .btn{ display:block; text-align:center; text-decoration:none; background:#fff; color:var(--blue); border:1.5px solid var(--blue); border-radius:12px; padding:11px; font-weight:800; font-size:14px; margin-top:12px; }
  .foot{ text-align:center; color:var(--soft); font-size:12px; margin:14px 0 24px; }
</style>
</head>
<body>
<div class="top"><div class="eyebrow">SCI CLUB</div><h1>Registro Pranzi</h1></div>
<main id="out"><div class="card vuoto">Caricamento…</div></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCt9D9Uomu3rNhDq1qDICuWnUdZJjmLlow",
  authDomain: "gestionale-422df.firebaseapp.com",
  projectId: "gestionale-422df",
  storageBucket: "gestionale-422df.firebasestorage.app",
  messagingSenderId: "821831582537",
  appId: "1:821831582537:web:51bc9804bc708c24369098"
};
const out = document.getElementById("out");
function el(tag, cls, txt){ const e = document.createElement(tag); if(cls) e.className = cls; if(txt!==undefined) e.textContent = txt; return e; }
function data(iso){
  if(!iso) return "Versato in precedenza";
  return new Date(iso + "T00:00:00").toLocaleDateString("it-IT", { weekday:"short", day:"numeric", month:"short", year:"numeric" });
}
function errore(t){ out.replaceChildren(el("div", "card vuoto", t)); }

// pulsante + pannello: aprendone uno si chiudono gli altri
const accordion = [];
function sezione(icona, titolo, pannello){
  const b = el("button", "acc");
  b.append(el("span", "ico", icona), el("b", "", titolo), el("span", "chev", "⌄"));
  pannello.classList.add("panel");
  b.addEventListener("click", ()=>{
    const aprire = !pannello.classList.contains("open");
    accordion.forEach(x=>{ x.b.classList.remove("open"); x.p.classList.remove("open"); });
    if(aprire){ b.classList.add("open"); pannello.classList.add("open"); }
  });
  accordion.push({ b, p: pannello });
  return [b, pannello];
}

const token = new URLSearchParams(location.search).get("c");
if(!token || !/^[A-Za-z0-9]{16,64}$/.test(token)){
  errore("Link non valido. Chiedi il link giusto a chi gestisce i pranzi.");
} else {
  try{
    const db = getFirestore(initializeApp(firebaseConfig));
    const [snap, snapGare] = await Promise.all([
      getDoc(doc(db, "genitori", token)),
      getDoc(doc(db, "genitori", "calendario-gare")).catch(()=>null)
    ]);
    if(!snap.exists()){ errore("Questo link non è ancora attivo o non è più valido. Chiedi un nuovo link a chi gestisce i pranzi."); }
    else{
      const d = snap.data();
      const frag = document.createDocumentFragment();

      // nome del bambino
      const c0 = el("div", "card");
      c0.append(el("div", "name", d.nome), el("div", "sub", "Stagione " + d.stagione));
      frag.append(c0);

      // PRANZI: resoconto, versamenti, giorni in cui ha mangiato
      const pPranzi = el("div");
      const r1 = el("div", "card");
      r1.append(el("span", "badge " + d.stato.code, d.stato.label), el("div", "detail", d.stato.detail));
      const t = el("div", "tiles");
      [[d.rimanenti, "pasti rimanenti"], ["€ " + d.pagato, "versati"], [d.consumati, "pasti mangiati"]].forEach(([v, l])=>{ const x = el("div", "tile"); x.append(el("b", "", String(v)), el("span", "", l)); t.append(x); });
      r1.append(t, el("div", "sub", "Ogni pasto costa € " + d.prezzo + "."));
      pPranzi.append(r1);
      const r2 = el("div", "card"); r2.append(el("h2", "", "Versamenti"));
      if(!d.versamenti.length) r2.append(el("div", "vuoto", "Nessun versamento registrato."));
      d.versamenti.forEach(v=>{ const r = el("div", "row"); r.append(el("span", "", data(v.d)), el("b", "", "€ " + v.eur)); r2.append(r); });
      pPranzi.append(r2);
      const r3 = el("div", "card"); r3.append(el("h2", "", "Giorni in cui ha mangiato (" + d.giorni.length + ")"));
      if(!d.giorni.length) r3.append(el("div", "vuoto", "Nessun pasto registrato."));
      d.giorni.forEach(g=>{ const r = el("div", "row"); r.append(el("span", "", data(g)), el("span", "", "€ " + d.prezzo)); r3.append(r); });
      pPranzi.append(r3);
      sezione("🍽️", "Pranzi", pPranzi).forEach(x=>frag.append(x));

      // GARE: prossima gara e calendario completo
      const pGare = el("div");
      if(snapGare && snapGare.exists() && (snapGare.data().gare || []).length){
        const cal = snapGare.data(), oggi = new Date(); oggi.setHours(0,0,0,0);
        const dt = s => new Date(s + "T00:00:00");
        const fine = x => x.a || x.d;
        const futuro = x => dt(fine(x)) >= oggi;
        const breve = x => dt(x).toLocaleDateString("it-IT", { weekday:"short", day:"numeric", month:"short" });
        const quando = x => (!x.a || x.a===x.d) ? breve(x.d) : breve(x.d) + " – " + breve(x.a);
        const prossima = cal.gare.find(x=>x.tipo==="gara" && futuro(x));
        if(prossima){
          const gg = Math.round((dt(prossima.d) - oggi) / 86400000);
          const n = el("div", "next"); n.append(el("small", "", "PROSSIMA GARA"), el("b", "", prossima.titolo), el("span", "", quando(prossima) + " · " + (gg<=0 ? "in corso" : gg===1 ? "domani" : "tra " + gg + " giorni")));
          pGare.append(n);
        }
        const c4 = el("div", "card"); c4.append(el("h2", "", "Tutte le gare"));
        let mese = "";
        const MESI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
        cal.gare.forEach(x=>{
          const m = x.d.slice(0,7);
          if(m!==mese){ mese = m; c4.append(el("div", "mese", MESI[Number(m.slice(5,7))-1] + " " + m.slice(0,4))); }
          const r = el("div", "row gara" + (futuro(x) ? "" : " passata")); const w = el("div");
          w.append(el("div", "t", x.titolo), el("div", "q", quando(x) + (x.tipo==="festa" ? " · festività" : "") + (x.note ? " · " + x.note : "")));
          r.append(w); c4.append(r);
        });
        if(cal.pdf){ const a = el("a", "btn", "📄 Apri il calendario ufficiale (PDF)"); a.href = cal.pdf; a.target = "_blank"; c4.append(a); }
        pGare.append(c4);
      } else {
        pGare.append(el("div", "card vuoto", "Il calendario gare non è ancora disponibile."));
      }
      sezione("🏁", "Gare", pGare).forEach(x=>frag.append(x));

      // OBIETTIVO: quello scritto sulla scheda del bambino
      const pObb = el("div"), cO = el("div", "card");
      if(d.obiettivo && String(d.obiettivo).trim()) cO.append(el("div", "obiettivo", String(d.obiettivo)));
      else cO.append(el("div", "vuoto", "Per ora non è stato scritto nessun obiettivo."));
      pObb.append(cO);
      sezione("🎯", "Obiettivo", pObb).forEach(x=>frag.append(x));

      const ag = d.aggiornato ? new Date(d.aggiornato) : null;
      frag.append(el("div", "foot", ag ? "Aggiornato il " + ag.toLocaleDateString("it-IT", { day:"numeric", month:"long" }) + " alle " + ag.toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit" }) : ""));
      out.replaceChildren(frag);
    }
  }catch(e){
    errore("Non riesco a caricare i dati: controlla la connessione e riprova.");
  }
}
</script>
</body>
</html>
